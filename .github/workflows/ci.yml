name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run pytest
        run: python -m pytest life_expectancy --cov

      - name: Run pylint
        run: python -m pylint life_expectancy